<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11130f" />
    <title>Rock Paper Scissors — Best of Hands</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #171913;
        --muted: #8d9184;
        --paper: #f2f0e8;
        --lime: #d7ff63;
        --orange: #ff875a;
        --line: rgba(242, 240, 232, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        color: var(--paper);
        background:
          radial-gradient(ellipse at 50% 0%, rgba(86, 101, 57, 0.2), transparent 44%),
          #11130f;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .game {
        width: min(100%, 760px);
        overflow: hidden;
        border: 1px solid rgba(242, 240, 232, 0.15);
        border-radius: 28px;
        background: #191b16;
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.38);
      }

      .topbar {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 30px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 18px rgba(215, 255, 99, 0.6);
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .round-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .reset-button {
        padding: 8px 0 8px 10px;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        transition: color 160ms ease;
      }

      .reset-button:hover,
      .reset-button:focus-visible {
        color: var(--paper);
      }

      main {
        padding: 46px 54px 50px;
      }

      .intro {
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--lime);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 48px);
        letter-spacing: -0.07em;
        line-height: 1;
      }

      .subtitle {
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .scoreboard {
        width: min(100%, 456px);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        margin: 36px auto 42px;
        padding: 19px 24px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.025);
      }

      .score {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .score:last-child {
        justify-content: flex-end;
        text-align: right;
      }

      .score-number {
        color: var(--paper);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .score:first-child .score-number {
        color: var(--lime);
      }

      .score-name {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .score-divider {
        padding: 0 22px;
        color: #55594e;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .prompt {
        min-height: 20px;
        margin: 0 0 20px;
        color: var(--paper);
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .choice {
        min-width: 0;
        min-height: 172px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #20221c;
        cursor: pointer;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .choice:hover,
      .choice:focus-visible {
        transform: translateY(-5px);
        border-color: var(--lime);
        outline: none;
        background: #25291c;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      }

      .choice:active {
        transform: translateY(-1px) scale(0.98);
      }

      .choice:disabled {
        cursor: wait;
        opacity: 0.65;
        transform: none;
      }

      .icon-wrap {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        border-radius: 23px;
        background: rgba(215, 255, 99, 0.08);
        color: var(--lime);
      }

      .choice:nth-child(2) .icon-wrap {
        background: rgba(255, 135, 90, 0.09);
        color: var(--orange);
      }

      .choice:nth-child(3) .icon-wrap {
        background: rgba(129, 195, 255, 0.09);
        color: #81c3ff;
      }

      .hand-icon {
        width: 53px;
        height: 53px;
        overflow: visible;
        fill: currentColor;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.6;
      }

      .hand-icon .cutout {
        fill: none;
      }

      .choice-name {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .choice-key {
        margin-top: -9px;
        color: #777b70;
        font-size: 10px;
      }

      .footnote {
        margin: 22px 0 0;
        color: #777b70;
        font-size: 11px;
        text-align: center;
      }

      dialog {
        width: min(calc(100% - 32px), 410px);
        padding: 0;
        overflow: visible;
        border: 1px solid rgba(242, 240, 232, 0.17);
        border-radius: 24px;
        background: #20221c;
        color: var(--paper);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      }

      dialog[open] {
        animation: modal-in 280ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      dialog::backdrop {
        background: rgba(5, 6, 4, 0.78);
        backdrop-filter: blur(7px);
        animation: backdrop-in 220ms ease both;
      }

      .result-card {
        padding: 30px;
        text-align: center;
      }

      .result-card .eyebrow {
        margin-bottom: 10px;
      }

      .result-title {
        margin: 0;
        font-size: 36px;
        letter-spacing: -0.06em;
      }

      .result-description {
        min-height: 20px;
        margin: 8px 0 25px;
        color: var(--muted);
        font-size: 13px;
      }

      .reveal {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 19px 14px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.025);
      }

      .reveal-side {
        display: grid;
        justify-items: center;
        gap: 7px;
      }

      .reveal-side .hand-icon {
        width: 47px;
        height: 47px;
      }

      .reveal-side:first-child {
        color: var(--lime);
      }

      .reveal-side:last-child {
        color: var(--orange);
      }

      .reveal-name {
        color: var(--paper);
        font-size: 12px;
        font-weight: 800;
        text-transform: capitalize;
      }

      .reveal-label {
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .versus {
        color: #777b70;
        font-size: 10px;
        font-weight: 800;
      }

      .next-button {
        width: 100%;
        min-height: 52px;
        margin-top: 22px;
        border: 0;
        border-radius: 12px;
        background: var(--lime);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 900;
        transition: transform 160ms ease, background 160ms ease;
      }

      .next-button:hover,
      .next-button:focus-visible {
        transform: translateY(-2px);
        outline: none;
        background: #e2ff91;
      }

      @keyframes modal-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes backdrop-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 16px 12px;
        }

        .game {
          border-radius: 22px;
        }

        .topbar {
          min-height: 62px;
          padding: 0 18px;
        }

        main {
          padding: 38px 18px 34px;
        }

        .scoreboard {
          margin: 29px auto 34px;
          padding: 16px;
        }

        .score-divider {
          padding: 0 12px;
        }

        .choices {
          gap: 9px;
        }

        .choice {
          min-height: 145px;
          gap: 12px;
          border-radius: 15px;
        }

        .icon-wrap {
          width: 64px;
          height: 64px;
          border-radius: 20px;
        }

        .hand-icon {
          width: 46px;
          height: 46px;
        }

        .choice-name {
          font-size: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Best of hands</div>
        <div class="topbar-right">
          <span class="round-label">Round <span id="round-number">01</span></span>
          <button class="reset-button" id="reset-button" type="button">Reset score</button>
        </div>
      </header>

      <main>
        <section class="intro" aria-labelledby="game-title">
          <p class="eyebrow">The ultimate showdown</p>
          <h1 id="game-title">Make your move.</h1>
          <p class="subtitle">Rock beats scissors. Scissors beats paper. You know the rest.</p>
        </section>

        <section class="scoreboard" aria-label="Scoreboard">
          <div class="score">
            <div class="score-number" id="player-score" aria-label="Your score">0</div>
            <div><span class="score-name">You</span></div>
          </div>
          <div class="score-divider" aria-hidden="true">VS</div>
          <div class="score">
            <div><span class="score-name">CPU</span></div>
            <div class="score-number" id="cpu-score" aria-label="Computer score">0</div>
          </div>
        </section>

        <p class="prompt" id="game-status" aria-live="polite">Pick your hand to start the round.</p>

        <section class="choices" aria-label="Choose your move">
          <button class="choice" type="button" data-choice="rock" aria-label="Choose rock (1)">
            <span class="icon-wrap" aria-hidden="true">
              <svg class="hand-icon" viewBox="0 0 64 64">
                <path d="M13 30.5 22 17l8-5 8 4 11 11 4 12-9 13H23L13 43z" />
                <path class="cutout" d="m22 18 7 11 7-12m-7 12 9 2m-9-2-2 10m11-8 9 2" />
              </svg>
            </span>
            <span class="choice-name">Rock</span>
            <span class="choice-key">Press 1</span>
          </button>
          <button class="choice" type="button" data-choice="paper" aria-label="Choose paper (2)">
            <span class="icon-wrap" aria-hidden="true">
              <svg class="hand-icon" viewBox="0 0 64 64">
                <path d="M18 8h20l12 12v36H18z" />
                <path class="cutout" d="M38 8v13h12M25 31h18M25 39h18M25 47h12" />
              </svg>
            </span>
            <span class="choice-name">Paper</span>
            <span class="choice-key">Press 2</span>
          </button>
          <button class="choice" type="button" data-choice="scissors" aria-label="Choose scissors (3)">
            <span class="icon-wrap" aria-hidden="true">
              <svg class="hand-icon" viewBox="0 0 64 64">
                <circle cx="18" cy="46" r="8" fill="none" />
                <circle cx="42" cy="46" r="8" fill="none" />
                <path d="m23 40 27-27a4 4 0 0 1 6 6L34 44m-4 0L8 19a4 4 0 0 1 6-6l27 27" />
              </svg>
            </span>
            <span class="choice-name">Scissors</span>
            <span class="choice-key">Press 3</span>
          </button>
        </section>

        <p class="footnote">No pressure. The computer definitely isn't nervous.</p>
      </main>
    </div>

    <dialog id="result-dialog" aria-labelledby="result-title" aria-describedby="result-description">
      <div class="result-card">
        <p class="eyebrow" id="result-round">Round 01 result</p>
        <h2 class="result-title" id="result-title">You win!</h2>
        <p class="result-description" id="result-description">A perfect pick.</p>
        <div class="reveal" aria-label="Round choices">
          <div class="reveal-side">
            <span id="player-reveal-icon"></span>
            <span class="reveal-name" id="player-reveal-name"></span>
            <span class="reveal-label">Your pick</span>
          </div>
          <span class="versus" aria-hidden="true">VS</span>
          <div class="reveal-side">
            <span id="cpu-reveal-icon"></span>
            <span class="reveal-name" id="cpu-reveal-name"></span>
            <span class="reveal-label">CPU pick</span>
          </div>
        </div>
        <button class="next-button" id="next-button" type="button">Play next round</button>
      </div>
    </dialog>

    <script>
      const moves = ["rock", "paper", "scissors"];
      const winningMoves = {
        rock: "scissors",
        paper: "rock",
        scissors: "paper",
      };
      const moveIcons = {
        rock: document.querySelector('[data-choice="rock"] .hand-icon').outerHTML,
        paper: document.querySelector('[data-choice="paper"] .hand-icon').outerHTML,
        scissors: document.querySelector('[data-choice="scissors"] .hand-icon').outerHTML,
      };
      const state = { playerScore: 0, cpuScore: 0, round: 1, isPlaying: false };
      const choiceButtons = [...document.querySelectorAll(".choice")];
      const status = document.querySelector("#game-status");
      const resultDialog = document.querySelector("#result-dialog");
      let roundTimer;
      let skipRoundAdvance = false;

      function updateScoreboard() {
        document.querySelector("#player-score").textContent = state.playerScore;
        document.querySelector("#cpu-score").textContent = state.cpuScore;
        document.querySelector("#round-number").textContent = String(state.round).padStart(2, "0");
      }

      function playRound(playerMove) {
        if (state.isPlaying || resultDialog.open) return;

        state.isPlaying = true;
        choiceButtons.forEach((button) => {
          button.disabled = true;
        });
        status.textContent = "The CPU is making its move...";

        roundTimer = window.setTimeout(() => {
          const cpuMove = moves[Math.floor(Math.random() * moves.length)];
          let result;

          if (playerMove === cpuMove) {
            result = "tie";
          } else if (winningMoves[playerMove] === cpuMove) {
            result = "win";
            state.playerScore += 1;
          } else {
            result = "loss";
            state.cpuScore += 1;
          }

          updateScoreboard();
          showResult(playerMove, cpuMove, result);
          state.isPlaying = false;
          choiceButtons.forEach((button) => {
            button.disabled = false;
          });
        }, 420);
      }

      function showResult(playerMove, cpuMove, result) {
        const titles = { win: "You win!", loss: "You lose!", tie: "It's a tie!" };
        const descriptions = {
          win: `${capitalize(playerMove)} beats ${cpuMove}. Nice one.`,
          loss: `${capitalize(cpuMove)} beats ${playerMove}. Run it back.`,
          tie: `You both picked ${playerMove}. Great minds.`,
        };

        document.querySelector("#result-title").textContent = titles[result];
        document.querySelector("#result-description").textContent = descriptions[result];
        document.querySelector("#result-round").textContent = `Round ${String(state.round).padStart(2, "0")} result`;
        document.querySelector("#player-reveal-icon").innerHTML = moveIcons[playerMove];
        document.querySelector("#cpu-reveal-icon").innerHTML = moveIcons[cpuMove];
        document.querySelector("#player-reveal-name").textContent = playerMove;
        document.querySelector("#cpu-reveal-name").textContent = cpuMove;
        document.querySelector("#next-button").textContent = "Play next round";
        resultDialog.showModal();
      }

      function capitalize(word) {
        return word[0].toUpperCase() + word.slice(1);
      }

      choiceButtons.forEach((button) => {
        button.addEventListener("click", () => playRound(button.dataset.choice));
      });

      document.querySelector("#next-button").addEventListener("click", () => {
        resultDialog.close();
      });

      resultDialog.addEventListener("close", () => {
        if (skipRoundAdvance) {
          skipRoundAdvance = false;
          return;
        }
        state.round += 1;
        updateScoreboard();
        status.textContent = "Pick your hand to start the next round.";
        document.querySelector(".choice:focus")?.blur();
        choiceButtons[0].focus();
      });

      document.querySelector("#reset-button").addEventListener("click", () => {
        window.clearTimeout(roundTimer);
        state.playerScore = 0;
        state.cpuScore = 0;
        state.round = 1;
        state.isPlaying = false;
        choiceButtons.forEach((button) => {
          button.disabled = false;
        });
        if (resultDialog.open) {
          skipRoundAdvance = true;
          resultDialog.close();
        }
        updateScoreboard();
        status.textContent = "Score reset. Pick your hand to start the round.";
      });

      document.addEventListener("keydown", (event) => {
        if (resultDialog.open || event.altKey || event.ctrlKey || event.metaKey) return;
        const keyboardMoves = { "1": "rock", "2": "paper", "3": "scissors" };
        if (keyboardMoves[event.key]) playRound(keyboardMoves[event.key]);
      });
    </script>
  </body>
</html>
